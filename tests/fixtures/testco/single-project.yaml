# Batch testco fixture — single-project scenario.
#
# Builds on `single-company.yaml`: same company-init shape, plus an
# `inputs.project:` block triggering project-init batch phase
# (per JUVANT_OS.md § Batch mode for project-init, and ADR 0012 §
# Schema). Tests the company-init → project-init transition end-to-end
# in a single claude --print run (cache reuse across phases).

scenario: single-project
fixture_version: 1
juvant_os_version: 0.7.0
description: |
  Solo founder, local SQLite, CRO enabled, telegram notifications,
  4 mail-enabled agents — same company shape as single-company.yaml.
  Plus one project (Apollo) bootstrapped immediately after company
  bootstrap completes, in the same claude --print invocation.
  Project DB is per-project local SQLite at .juvant/project-apollo.db.
  GitHub repo creation is skipped (no gh api call in batch); install-
  spec decision row recorded with applied=false. Doc folder auto-
  discovery is skipped; project records doc_folder=null.

inputs:
  # Step 1 — Identity (company).
  identity:
    company_name: Single Project Test Corp
    company_slug: single-project-test
    company_domain: singleprojecttest.example
    ceo_name: Casey Project
    ceo_pronouns: they/them
    copyright_holder: Single Project Test Corp

  # Step 1.5 — Document storage.
  doc_storage:
    provider: onedrive
    mcp_server: ms-graph
    path_pattern: type-it
    folders: {}
    fallback_chain: {}

  # Step 1.5b — Mail-enabled agents.
  mail_enabled_agents:
    cfo: finance@singleprojecttest.example
    clo: legal@singleprojecttest.example
    cco: hello@singleprojecttest.example
    cmo: press@singleprojecttest.example

  # Step 1.6 — GitHub user map.
  github_user_map:
    ceo: casey-project
    cos: casey-project
    cfo: casey-project
    clo: casey-project
    cmo: casey-project
    cco: casey-project
    chro: casey-project
    cso: casey-project
    cetho: casey-project
    ca: casey-project
    cro: casey-project
    eng-platform: casey-project

  # Step 2 — Database.
  database:
    provider: local
    setup_mode: cli
    url: file:.juvant/state.db
    auth_token: null

  # Step 3 — Bank.
  bank:
    provider: other
    name: singleprojecttest-bank
    mcp_server: 'npm:@singleprojecttest/bank-mcp-stub'
    rationale: |
      No real bank for the test fixture.

  # Step 4 — Notifications.
  notifications:
    telegram:
      enabled: true
      bot_token: TEST_TOKEN_PLACEHOLDER
      chat_id: '987654321'
      is_operator_personal_channel: true
      message_time_window: '08:00-22:00 Europe/Rome'
    webhooks: []

  # Step 4.5 — Agent action guardrails.
  guardrails:
    confirmation_token:
      enabled: true
      token: TEST_CONFIRM_TOKEN_PLACEHOLDER
    anomaly_thresholds:
      cost_p95_multiplier: 3.0
      tool_call_burst_per_min: 60
    audit_log_retention_days: 365

  # Step 5 — Counterparties.
  counterparties:
    mode: sample
    entries:
      - { name: Accountant Stub, role: accountant, owner_agent: cfo, contact: accountant@singleprojecttest.example }
      - { name: Legal Stub,      role: legal,      owner_agent: clo, contact: legal-counsel@singleprojecttest.example }

  # Step 6 — Agent names + CRO toggle.
  agent_names:
    cos: Atlas
    cfo: Theos
    clo: Lex
    cmo: Mira
    cco: Hermes
    chro: Sage
    cso: Shield
    cetho: Vera
    ca: Arch
    cro: Lumen
    eng-platform: Hephaestus
  cro_enabled: true

  # Step 9 — Bootstrap protocol manifesto approval mode.
  bootstrap:
    manifesto_approval_mode: accept_all_defaults

  # Step 10.5 — Branch protection.
  branch_protection:
    mode: skip_in_batch

  # ──────────────────────────────────────────────────────────────────
  # Project-init phase (auto-chained after company-init completes,
  # per JUVANT_OS.md § Batch mode for project-init).
  # ──────────────────────────────────────────────────────────────────
  project:
    # proj.1 — Project identity.
    slug: apollo
    name: Apollo
    description: First project on the single-project test fixture company.

    github_repo:
      mode: skip_in_batch        # no gh api call; install-spec decision applied=false
      org_target: juvantlabs
      repo_name: apollo-stub
      visibility: private

    doc_folder:
      mode: skip_auto_discovery  # no M365/GDrive folder scan
      path: null                 # null → projects.apollo.doc_folder is unset

    # proj.2 — Project database (local SQLite per-project file).
    database:
      provider: local
      url: file:.juvant/project-apollo.db
      auth_token: null

    # proj.3 — Agent names. Defaults are <slug>-<role>; override here.
    agent_names:
      cto: Pallas
      cpo: Echo
      cdo: Iris
      coo: Tyche
      vpe: Praxis
      eng-api: Crispus
      eng-backend: Mark
      eng-frontend: Pliny
      eng-ai: Linus

    # proj.4 — Compile project templates: deterministic, no inputs.

    # proj.5 — Project bootstrap protocol.
    bootstrap:
      manifesto_approval_mode: accept_all_defaults

    # proj.6 — Initial commit.
    commit:
      push: false                # no remote push from CI / batch context

# ─────────────────────────────────────────────────────────────────────
# Expectations consumed by the driver's post-run assertions.
# ─────────────────────────────────────────────────────────────────────
expect:
  # ─── Company phase ─────────────────────────────────────────────────
  bootstrap_verdict: WARN-WITH-CONDITIONS
  bootstrap_verdict_acceptable: [WARN-WITH-CONDITIONS, PASS]

  manifests_count: 19           # 10 company + 9 project tier-2 manifestos
  decisions_count: 12           # 11 company bootstrap-action + 1 project install-spec (skipped)
  matrix_rows_count: 20         # matrix is per-company; project init does not add rows
                                # (no project_id column in agent_tool_matrix per schema)

  # ─── Project phase ─────────────────────────────────────────────────
  project_phase:
    projects_count: 1           # rows in projects table
    project_slug: apollo
    project_status: active
    project_maturity: incubation
    project_agents_count: 9     # rows in agents table with project_id='apollo'
    project_manifests_count: 9  # tier-2 project manifestos
    project_bootstrap_audit:
      auditor: cso
      audit_type: bootstrap_baseline
      scope: apollo
      verdict_acceptable: [PASS, WARN-WITH-CONDITIONS]
      p0_max: 0
      p1_max: 0
    project_db_file_exists: '.juvant/project-apollo.db'
    project_db_has_schema: true  # migrate.sh ran against project DB

  # ─── Combined audit findings (company + project) ──────────────────
  audit_findings:
    p0_max: 0
    p1_max: 0
    p2_max: 3                   # status-pending: bank, fattura_elettronica, buffer
    info_min: 18                # ≥ 10 from company + ≥ 8 from project audit

  matrix_row_assertions:
    - { role: cos,          channels_includes: [telegram:send-ceo-only] }
    - { role: cos,          mcp_servers_includes: [turso, ms-graph, m365-graph] }
    - { role: cfo,          mcp_servers_includes: [m365-graph, fattura_elettronica, bank:read] }
    - { role: clo,          mcp_servers_includes: [m365-graph] }
    - { role: cmo,          mcp_servers_includes: [m365-graph, buffer] }
    - { role: cco,          mcp_servers_includes: [m365-graph] }
    - { role: cro,          mcp_servers_includes: [m365-graph] }
    - { role: cdo,          mcp_servers_includes: [m365-graph] }
    - { role: eng-platform, scope: company, mcp_servers: [turso, github:read] }
    - { role: coo,          mcp_servers: [turso, github:write] }

  decision_categories:
    bootstrap-action_min: 19    # 11 (company) + 9 (project bootstrap) - shared category
    install-spec_min: 1         # project github_repo skip_in_batch decision

  filesystem_assertions:
    - { path: README.md, must_contain: 'Single Project Test Corp' }
    - { path: README.md, must_not_contain: 'open-source multi-agent' }
    - { path: CHANGELOG.md, must_contain: 'Single Project Test Corp' }
    - { path: SECURITY.md, must_contain: 'Single Project Test Corp' }
    - { path: docs/adr/README.md, must_contain: 'Single Project Test Corp' }
    - { path: 'docs/adr/0001-skill-first-architecture.md', must_not_exist: true }
    - { path: 'docs/adr/0010-compiled-agent-registration.md', must_not_exist: true }
    - { path: '.github/CODEOWNERS', must_contain: '@casey-project' }
    - { path: '.juvant/config.json', must_exist: true }
    - { path: '.juvant/state.db', must_exist: true }
    - { path: '.juvant/project-apollo.db', must_exist: true }
    # Project-scope agent files materialized:
    - { path: 'agents/projects/apollo/cto.md', must_exist: true }
    - { path: 'agents/projects/apollo/cpo.md', must_exist: true }
    - { path: 'agents/projects/apollo/coo.md', must_exist: true }

  pending_orphan_assertions:
    AskUserQuestion: 0
    Bash_max: 0

  performance_envelope:
    total_duration_s_max: 900   # ~50% above single-company budget for project phase
    total_tokens_max: 130000    # cache_read amortizes the second phase
    step_duration_s_p95: 60

  agent_actions_log:
    min_rows: 130               # company ~100 + project ~30
    tool_call_distribution:
      Bash_min: 50
      Agent_count: 2            # company CSO audit + project CSO audit
      AskUserQuestion: 0

  phase_events:
    company_phase_done: true    # [BATCH] phase_done with phase=company emitted
    project_phase_started: true # [BATCH] step_start with step=proj.1 emitted
    run_complete_dual_verdict: true  # run_complete includes company_verdict + project_verdict
