name: Juvant OS testco batch

# Per ADR 0012 — Batch testco mode + CI integration:
#
# Manual local testco remains the primary validation mode. Local-driven
# `bash scripts/run-testco-batch.sh ...` is the canonical pre-release
# gate; this workflow exists as an *opt-in* CI re-run for cases where
# you want a GitHub-side audit artifact (PR-blockers, adopter
# enterprises with their own credentials, etc.).
#
# Triggers: workflow_dispatch only. No tag-push trigger, no PR-label
# trigger. To run, click "Run workflow" in the Actions tab and provide
# scenarios. The workflow needs an authenticated Claude Code backend —
# either ANTHROPIC_API_KEY repo secret, or Microsoft Foundry / Bedrock /
# Vertex with the matching env vars (configure under workflow_dispatch
# inputs or as secrets per your auth path).
#
# Cost discipline: every dispatched run consumes ~30k–120k tokens
# (~$0.50–$2 at Opus pricing depending on scenario count). The
# workflow does NOT auto-fire — there is no recurring cost.

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Comma-separated scenario list, or "all"'
        type: string
        default: solo-founder-local-sqlite

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.set.outputs.scenarios }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          # All defined scenarios. Append new ones as fixtures land
          # under tests/fixtures/testco/<scenario>.yaml.
          all_scenarios='["solo-founder-local-sqlite"]'

          input='${{ github.event.inputs.scenarios }}'
          if [[ "$input" == "all" ]]; then
            scenarios="$all_scenarios"
          elif [[ -n "$input" ]]; then
            # Comma-separated list → JSON array (compact for GITHUB_OUTPUT).
            scenarios=$(echo "$input" \
              | tr ',' '\n' | sed 's/^ *//; s/ *$//' \
              | jq -Rrcs 'split("\n") | map(select(length>0))')
          else
            scenarios='["solo-founder-local-sqlite"]'
          fi

          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"
          echo "Resolved scenario matrix: $scenarios"

  validate-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Validate every fixture under tests/fixtures/testco/
        run: |
          set -euo pipefail
          fail=0
          shopt -s nullglob
          for f in tests/fixtures/testco/*.yaml; do
            echo "::group::validate $f"
            bash scripts/validate-batch-fixture.sh "$f" || fail=1
            echo "::endgroup::"
          done
          [ "$fail" = 0 ]

  batch:
    needs: [resolve-matrix, validate-fixtures]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.resolve-matrix.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          # jq, sqlite3, git already present on ubuntu-latest

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run batch testco
        env:
          # Configure ONE of the following auth paths in repo secrets:
          # - ANTHROPIC_API_KEY (direct Anthropic API)
          # - CLAUDE_CODE_USE_FOUNDRY=1 + ANTHROPIC_FOUNDRY_RESOURCE +
          #   azure/login@v2 OIDC step (Microsoft Foundry)
          # - CLAUDE_CODE_USE_BEDROCK=1 + AWS creds (Bedrock)
          # - CLAUDE_CODE_USE_VERTEX=1 + GCP creds (Vertex)
          # Defaults below assume Anthropic direct; adapters fork and
          # adjust per their auth path.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          bash scripts/run-testco-batch.sh \
            tests/fixtures/testco/${{ matrix.scenario }}.yaml \
            --no-render \
            --skill-version=${{ github.sha }}

      - name: Render job summary
        if: always()
        run: |
          set -euo pipefail
          RESULTS_DIR=tests/fixtures/testco/results
          if [ -d "$RESULTS_DIR" ]; then
            for f in "$RESULTS_DIR"/*-${{ matrix.scenario }}.md; do
              [ -f "$f" ] || continue
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ matrix.scenario }}-${{ github.run_id }}
          path: |
            tests/fixtures/testco/results/
            /tmp/testco-batch-*/.juvant/state.db
            /tmp/testco-batch-*/session.log
            /tmp/testco-batch-*/events.jsonl
          if-no-files-found: ignore
          retention-days: 30
