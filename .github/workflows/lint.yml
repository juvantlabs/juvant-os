name: Juvant OS lint

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'release/**'
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Markdown lint
        run: npm install -g markdownlint-cli2

      - name: Markdown lint
        run: markdownlint-cli2 "**/*.md" "#node_modules" "#.git"
        continue-on-error: true
        # The OSS template ships intentionally relaxed Markdown rules;
        # adopters can tighten via .markdownlint.yaml in their fork.

      - name: Validate YAML frontmatter on agent templates
        run: |
          pip install pyyaml
          python3 - <<'PY'
          import sys, re, pathlib
          import yaml

          failed = []
          for f in pathlib.Path("agents").rglob("*.md"):
              content = f.read_text()
              m = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
              if not m:
                  failed.append((str(f), "no YAML frontmatter found"))
                  continue
              try:
                  yaml.safe_load(m.group(1))
              except yaml.YAMLError as e:
                  failed.append((str(f), f"YAML parse error: {e}"))

          if failed:
              for path, err in failed:
                  print(f"  {path}: {err}")
              sys.exit(1)
          print(f"OK — YAML frontmatter valid in all agent templates")
          PY

      - name: Validate scripts/schema.sql via sqlite3 dry-run
        run: |
          sudo apt-get install -y sqlite3
          sqlite3 :memory: < scripts/schema.sql
          echo "OK — schema.sql parses cleanly"

      - name: Validate .claude/settings.json
        run: |
          python3 -c "import json; json.load(open('.claude/settings.json'))"
          echo "OK — .claude/settings.json is valid JSON"

      - name: Detect tracked secrets (defense in depth)
        run: |
          # Refuse to ship if any of the well-known secret patterns appear
          # in tracked files. CSO Layer 2 mirror; per-company instances
          # should add tighter scanners (gitleaks, trufflehog, etc.) post-init.
          OFFENDERS=$(git grep -nE '(BEGIN (RSA |EC )?PRIVATE KEY|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82,}|sk-[A-Za-z0-9]{40,}|xox[abrs]-[A-Za-z0-9-]+)' -- ':!*.md' ':!CHANGELOG.md' || true)
          if [ -n "$OFFENDERS" ]; then
            echo "Tracked secrets detected:"
            echo "$OFFENDERS"
            exit 1
          fi
          echo "OK — no tracked secrets detected"

      - name: Shellcheck + bash -n — hooks + scripts + helpers
        run: |
          # Lint shipped shell scripts. helpers/ is the FEAT-007 deliverable
          # directory; pattern includes it for forward compatibility (nullglob
          # makes the loop a no-op when helpers/ is absent).
          #
          # `bash -n` (parse-only) is run ALONGSIDE shellcheck because they use
          # different parsers and catch different defects: shellcheck's parser
          # accepted an unbalanced single quote inside a $(cat <<SQL ...)
          # heredoc that broke the real bash parse of scripts/migrate.sh (a
          # `migration's` apostrophe), shipping a migration that aborted at
          # startup. shellcheck green is necessary but not sufficient.
          sudo apt-get install -y shellcheck
          shopt -s nullglob
          fail=0
          for f in hooks/*.sh hooks/lib/*.sh scripts/*.sh helpers/*.sh; do
            echo "::group::lint $f"
            shellcheck "$f" || fail=1
            bash -n "$f" || { echo "bash -n FAILED: $f"; fail=1; }
            echo "::endgroup::"
          done
          [ "$fail" = 0 ]

      - name: Dependency vulnerability scan (placeholder)
        run: |
          # No-op until a dependency manifest lands in this repo. The OSS
          # template currently ships bash + markdown only — no package.json,
          # no requirements.txt, no Cargo.toml. When per-helper or per-plugin
          # manifests land (FEAT-007 helpers, future plugins/), swap to
          # npm audit / pip-audit / cargo audit gated by file existence.
          echo "no dependency manifest in repo; skipping dep-vuln scan"

      - name: Schema validators (FEAT-008 L4)
        run: |
          pip install --quiet pyyaml
          python3 tests/schema/validate.py
          bash tests/migrate/test-v07-to-v08-agents.sh
          bash tests/helpers/test-turso-backup-archival.sh

      - name: Eval scenario lint (FEAT-008 L1)
        run: |
          bash tests/scenarios/lint.sh

      - name: Sync/compile tests
        run: |
          # Guards the upstream-sync whitelist completeness, compile-templates
          # --check-only safety, and v0-matrix doc/JSON count consistency.
          bash tests/sync/test-sync-compile.sh

      - name: Hook tests (FEAT-008 L2)
        run: |
          # jq + sqlite3 already installed in earlier steps. Tests use
          # tests/hooks/fake-turso.sh as a `turso db shell` shim
          # redirecting to a local SQLite file (no Turso credentials
          # required in CI).
          bash tests/hooks/run-tests.sh
          # Track 2e sensitive-space deny-list canary (ADR 0025/0027).
          # Standing regression gate: re-runs on every hook change and on
          # every classified-MCP bump (a new tool must not slip in
          # unclassified for non-allowlisted agents).
          bash tests/hooks/test-space-access-policy.sh

      - name: Helper tests
        run: |
          # Auto-discovers every tests/helpers/*.sh regression (scheduled-helper
          # generators with stubbed schedulers, db.sh provider routing, etc.).
          # New helper tests are picked up without editing this step. Uses the
          # fake-turso shim + local sqlite3, so no Turso credentials in CI.
          shopt -s nullglob
          fail=0
          for f in tests/helpers/*.sh; do
            echo "::group::$f"; bash "$f" || fail=1; echo "::endgroup::"
          done
          [ "$fail" = 0 ]
